[package]
name = "termdeck"
version = "0.1.0"
description = "Lightweight terminal deck for WSL + PowerShell agent sessions"
license = "MIT"
edition = "2021"

[lib]
name = "termdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
arboard = { version = "3", default-features = false }
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 4
strip = true
